services:
  greek:
    build: .
    image: greek:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Прогресс пользователей: греческий `greek.db` и бэкапы.
      - ./data:/app/data
      # Контент — тот же git-репозиторий, только для чтения. git pull подхватывается без пересборки.
      - ./:/app/content:ro
    environment:
      - SESSION_SECRET=${SESSION_SECRET:?задайте SESSION_SECRET в файле .env}
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
